<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微澜 LYNLI | 探索边界</title>
<style>
  :root {
    /* 蓝白渐变背景 */
    --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 50%, #e8f0f9 100%);
    /* 毛玻璃背景色 */
    --glass-bg: rgba(255, 255, 255, 0.45);
    --glass-border: rgba(255, 255, 255, 0.7);
    --text-main: #1e293b;
    --text-sub: #64748b;
    --acc: #2563eb; /* 亮蓝色按钮 */
    --acc-hover: #1d4ed8;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* 顶部导航：毛玻璃 */
  header {
    position: fixed; top: 0; width: 100%; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px;
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--glass-border);
  }
  .logo-area { display: flex; align-items: center; gap: 12px; }
  .logo-area img { height: 40px; border-radius: 50%; }
  .logo-text h1 { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
  .logo-text p { font-size: 12px; color: var(--text-sub); letter-spacing: 2px; }

  .btn {
    cursor: pointer; border: 0; border-radius: 20px; padding: 10px 20px;
    background: var(--acc); color: #fff; font-size: 14px; font-weight: 500;
    transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(37,99,235,0.2);
  }
  .btn:hover { background: var(--acc-hover); transform: translateY(-2px); }
  .btn-outline { background: rgba(255,255,255,0.6); color: var(--text-main); border: 1px solid var(--glass-border); box-shadow: none;}
  .btn-outline:hover { background: #fff; }

  /* 英雄区 */
  .hero {
    padding: 120px 20px 40px;
    text-align: center;
  }
  .hero h1 { 
    font-size: 42px; font-weight: 800; line-height: 1.2; letter-spacing: -1px;
    margin-bottom: 20px; color: var(--text-main);
  }
  .hero h1 span {
    background: linear-gradient(90deg, #2563eb, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p {
    font-size: 15px; color: var(--text-sub); max-width: 400px; margin: 0 auto;
    padding: 16px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    border: 1px solid var(--glass-border);
  }

  /* 内容区 */
  main { max-width: 1000px; margin: 0 auto 60px; padding: 0 20px; }
  
  .section-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; margin-top: 40px;}
  
  /* 胶囊分类标签 */
  .tags { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
  .tags::-webkit-scrollbar { display: none; }
  .tag {
    white-space: nowrap; padding: 8px 20px; border-radius: 20px; font-size: 14px;
    background: rgba(255,255,255,0.5); color: var(--text-sub);
    border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s;
  }
  .tag.active { background: var(--acc); color: #fff; border-color: var(--acc); box-shadow: 0 4px 12px rgba(37,99,235,0.2); }

  /* 商品网格：毛玻璃卡片 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s;
  }
  .card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
  .card-img-wrapper { width: 100%; aspect-ratio: 1; overflow: hidden; background: #fff; }
  .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
  .card:hover .card-img-wrapper img { transform: scale(1.05); }
  
  .card-body { padding: 20px; }
  .card-tag { display: inline-block; font-size: 12px; color: var(--acc); background: rgba(37,99,235,0.1); padding: 4px 10px; border-radius: 8px; margin-bottom: 12px; font-weight: 500;}
  .card-name { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
  .card-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; line-height: 1.5; }
  .card-bottom { display: flex; justify-content: space-between; align-items: center; }
  .card-price { font-size: 22px; font-weight: 700; color: var(--text-main); }
  
  /* 底部 */
  footer { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 13px; border-top: 1px solid var(--glass-border); }
  .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 16px; }
  .footer-links span { cursor: pointer; }

  /* 登录弹窗 */
  #modal { position: fixed; inset: 0; background: rgba(255,255,255,0.3); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
  #modal.on { display: flex; }
  .modal-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); width: 90%; max-width: 400px; padding: 30px; border-radius: 24px; border: 1px solid #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.1); position: relative; }
  .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: 0; color: var(--text-sub); font-size: 24px; cursor: pointer; }
  .form-group { margin-bottom: 16px; }
  .form-group input { width: 100%; padding: 14px 16px; background: #f1f5f9; border: 1px solid transparent; border-radius: 12px; color: var(--text-main); font-size: 15px; outline: none; transition: 0.3s; }
  .form-group input:focus { background: #fff; border-color: var(--acc); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
  #msg { color: #ef4444; font-size: 13px; margin-bottom: 12px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <!-- 使用你的 logo -->
    <img src="./logo.png" alt="LYNLI" />
    <div class="logo-text">
      <h1>微澜</h1>
      <p>LYNLI</p>
    </div>
  </div>
  <div>
    <button class="btn btn-outline" id="loginBtn" onclick="openModal()" style="margin-right: 8px;">登录</button>
    <button class="btn" id="userBtn" style="display:none" onclick="logout()">退出</button>
  </div>
</header>

<main>
  <div class="hero">
    <h1>探索边界，<br><span>重塑未来</span></h1>
    <p>智能硬件 · 数字资源 · 极速节点。<br>解锁你的全维度生活体验。</p>
  </div>

  <h2 class="section-title">精选系列</h2>
  
  <div class="tags">
    <div class="tag active">全部</div>
    <div class="tag">智能互动</div>
    <div class="tag">私密护理</div>
    <div class="tag">互动玩具</div>
  </div>

  <div class="grid" id="productGrid"></div>
</main>

<footer>
  <div class="footer-links">
    <span>关于我们</span>
    <span>联系我们</span>
    <span>用户服务协议</span>
    <span>隐私政策</span>
  </div>
  <p>© 2026 微澜 LYNLI. All Rights Reserved.</p>
</footer>

<div id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 style="margin-bottom:24px; font-size:22px; text-align:center;">账号登录</h2>
    <div id="msg"></div>
    <div class="form-group"><input type="email" id="email" placeholder="输入邮箱地址" /></div>
    <div class="form-group"><input type="password" id="password" placeholder="输入密码" /></div>
    <button class="btn" style="width:100%; padding: 14px; border-radius: 12px; font-size:16px; margin-top:8px;" onclick="submitAuth()">登录</button>
  </div>
</div>

<script>
const API_BASE = 'https://api.lynli.me'; 
let token = localStorage.getItem('lynli_token') || '';

// ⚠️ 记得把这里的 id 对应到你 Lynli Panel 后台的套餐 ID
const products = [
  { id: 1, name: "智能互动设备 Pro", tag: "智能互动", price: 1299, desc: "亲肤材质 · 智能温控 · APP互联", image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?q=80&w=800&auto=format&fit=crop" },
  { id: 2, name: "私密护理仪 Mini", tag: "私密护理", price: 899, desc: "极简设计 · 静音马达 · 磁吸快充", image: "https://images.unsplash.com/photo-1598440947619-2c3f844f58a5?q=80&w=800&auto=format&fit=crop" },
  { id: 3, name: "全息交互玩具", tag: "互动玩具", price: 599, desc: "沉浸式体验 · 远程遥控 · 防水设计", image: "https://images.unsplash.com/photo-1617104551722-3b2d51366400?q=80&w=800&auto=format&fit=crop" }
];

checkLogin();
renderProducts();

function renderProducts() {
  document.getElementById('productGrid').innerHTML = products.map(p => `
    <div class="card">
      <div class="card-img-wrapper">
        <img src="${p.image}" alt="${p.name}" />
      </div>
      <div class="card-body">
        <div class="card-tag">${p.tag}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-bottom">
          <div class="card-price">¥${p.price}</div>
          <button class="btn" onclick="buyProduct(${p.id})">立即体验</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openModal() { document.getElementById('modal').classList.add('on'); }
function closeModal() { document.getElementById('modal').classList.remove('on'); document.getElementById('msg').innerText = ''; }

async function req(path, method = 'GET', body = null) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const opt = { method, headers };
  if (body) opt.body = JSON.stringify(body);
  const res = await fetch(API_BASE + path, opt);
  const data = await res.json();
  if (!res.ok || data.code === 0) throw new Error(data.msg || '请求失败');
  return data;
}

async function submitAuth() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) return document.getElementById('msg').innerText = '请填写完整';
  try {
    const res = await req('/api/v1/passport/auth/login', 'POST', { email, password });
    token = res.data.auth_data || res.data.token; 
    localStorage.setItem('lynli_token', token);
    closeModal();
    checkLogin();
  } catch (e) {
    document.getElementById('msg').innerText = e.message;
  }
}

function checkLogin() {
  if (token) {
    document.getElementById('loginBtn').style.display = 'none';
    document.getElementById('userBtn').style.display = 'inline-block';
  } else {
    document.getElementById('loginBtn').style.display = 'inline-block';
    document.getElementById('userBtn').style.display = 'none';
  }
}
function logout() { token = ''; localStorage.removeItem('lynli_token'); checkLogin(); }

// 对接你自己的接口
async function buyProduct(planId) {
  if (!token) { openModal(); return; }
  
  try {
    const saveRes = await req('/api/v1/user/order/save', 'POST', { plan_id: planId, quantity: 1 });
    const orderId = saveRes.data; 
    
    const payRes = await req('/api/v1/user/order/pay', 'POST', { trade_no: orderId });
    const payData = payRes.data;
    
    if (payData.type === 'url' || payData.pay_url) {
      window.location.href = payData.pay_url || payData.url;
    } else if (payData.type === 'qrcode') {
      alert("请使用支付宝或 USDT 扫码支付: " + payData.qrcode_url);
    } else {
      alert("请前往支付: " + JSON.stringify(payData)); 
    }
  } catch (e) {
    alert('购买失败: ' + e.message);
  }
}
</script>
</body>
</html>
