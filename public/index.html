<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LYNLI</title>
<style>
  :root{--bg:#0f1115;--card:#191c22;--line:#272b33;--fg:#e8eaed;--sub:#9aa3ad;--acc:#d946ef}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:rgba(15,17,21,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:18px;letter-spacing:1px}
  button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:#fff}
  button:disabled{background:#3a3f47;color:#8b939c;cursor:not-allowed}
  #cartBtn{background:var(--card);border:1px solid var(--line);color:var(--fg)}
  #cartCount{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;
    background:var(--acc);color:#fff;font-size:12px;text-align:center}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;
    padding:20px;max-width:1100px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{aspect-ratio:1;display:grid;place-items:center;font-size:64px;background:linear-gradient(135deg,#23272f,#171a20)}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .name{font-weight:600}
  .desc{color:var(--sub);font-size:13px;flex:1}
  .price{color:var(--acc);font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .soldout{color:var(--sub);font-size:13px}
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  #mask.on{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);
    border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:21;display:flex;flex-direction:column}
  #drawer.on{transform:none}
  .dhead{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
  .close{background:transparent;color:var(--sub);padding:6px 10px;font-size:20px}
  #items{flex:1;overflow:auto;padding:12px 16px}
  .line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .line .em{font-size:28px}
  .line .info{flex:1}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:2px 10px}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  form{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  input,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font:inherit}
  .total{display:flex;justify-content:space-between;font-weight:700}
  #msg{color:#3ddc84;font-size:14px;word-break:break-all;min-height:18px}
</style>
</head>
<body>
<header>
  <h1>LYNLI</h1>
  <button id="cartBtn">购物车<span id="cartCount">0</span></button>
</header>

<main id="grid"></main>

<div id="mask"></div>
<aside id="drawer">
  <div class="dhead"><strong>购物车</strong><button class="close" id="closeBtn">×</button></div>
  <div id="items"></div>
  <form id="orderForm">
    <div class="total"><span>合计</span><span id="total">¥0</span></div>
    <div style="font-size:12px;color:#9aa3ad;margin-bottom:8px;">🔒 隐私发货 · 包裹无敏感词 · 保密包装</div>
    <input name="name" placeholder="收货人姓名" required />
    <input name="phone" placeholder="手机号" required />
    <textarea name="address" rows="2" placeholder="收货地址" required></textarea>
    <button type="submit">提交订单</button>
    <div id="msg"></div>
  </form>
</aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = n => '¥' + Number(n).toFixed(2).replace(/\.00$/, '');

// 纯静态写死的数据
let products = [
  { id: "p1", name: "静音震动跳蛋", price: 129, stock: 100, emoji: "🩷", desc: "超静音 · 10频震动 · 亲肤硅胶" },
  { id: "p2", name: "双头震动棒", price: 259, stock: 50, emoji: "🪄", desc: "G点刺激 · 防水设计 · 磁吸充电" },
  { id: "p3", name: "男士飞机杯", price: 189, stock: 80, emoji: "🥃", desc: "通道紧致 · 易清洗 · 柔软TPE" },
  { id: "p4", name: "情侣共震器", price: 299, stock: 30, emoji: "💞", desc: "双人互动 · 远程遥控 · U型佩戴" },
  { id: "p5", name: "润滑液 100ml", price: 49, stock: 200, emoji: "💧", desc: "水溶性 · 不粘腻 · 易清洗" }
];

let cart = JSON.parse(localStorage.getItem('cart') || '{}');

const persist = () => localStorage.setItem('cart', JSON.stringify(cart));
const productOf = id => products.find(p => p.id === id);
const cartLines = () => Object.entries(cart)
  .map(([id, qty]) => ({ p: productOf(id), qty }))
  .filter(l => l.p && l.qty > 0);

function renderGrid() {
  $('#grid').innerHTML = products.map(p => `
    <article class="card">
      <div class="thumb">${p.emoji || '📦'}</div>
      <div class="body">
        <div class="name">${esc(p.name)}</div>
        <div class="desc">${esc(p.desc)}</div>
        <div class="row">
          <span class="price">${money(p.price)}</span>
          ${p.stock > 0
            ? `<button data-add="${esc(p.id)}">加入购物车</button>`
            : `<span class="soldout">已售罄</span>`}
        </div>
      </div>
    </article>`).join('');
}

function renderCart() {
  const lines = cartLines();
  $('#cartCount').textContent = lines.reduce((s, l) => s + l.qty, 0);

  $('#items').innerHTML = lines.length ? lines.map(({ p, qty }) => `
    <div class="line">
      <div class="em">${p.emoji || '📦'}</div>
      <div class="info">
        <div>${esc(p.name)}</div>
        <div class="price">${money(p.price * qty)}</div>
      </div>
      <div class="qty">
        <button data-dec="${esc(p.id)}">−</button>
        <span>${qty}</span>
        <button data-inc="${esc(p.id)}">＋</button>
      </div>
    </div>`).join('') : '<div class="empty">购物车还是空的</div>';

  $('#total').textContent = money(lines.reduce((s, l) => s + l.p.price * l.qty, 0));
  persist();
}

const openDrawer = () => { $('#drawer').classList.add('on'); $('#mask').classList.add('on'); };
const closeDrawer = () => { $('#drawer').classList.remove('on'); $('#mask').classList.remove('on'); };

$('#cartBtn').onclick = openDrawer;
$('#closeBtn').onclick = closeDrawer;
$('#mask').onclick = closeDrawer;

document.addEventListener('click', e => {
  const { add, inc, dec } = e.target.dataset;

  if (add) {
    const p = productOf(add);
    cart[add] = Math.min((cart[add] || 0) + 1, p.stock);
    renderCart();
    openDrawer();
  }
  if (inc) {
    const p = productOf(inc);
    cart[inc] = Math.min((cart[inc] || 0) + 1, p.stock);
    renderCart();
  }
  if (dec) {
    cart[dec] = (cart[dec] || 0) - 1;
    if (cart[dec] <= 0) delete cart[dec];
    renderCart();
  }
});

$('#orderForm').onsubmit = async e => {
  e.preventDefault();
  const msg = $('#msg');
  msg.style.color = '#3ddc84';
  msg.textContent = '✅ 预览模式：订单已提交（当前为纯前端展示，暂未对接后台）';
  // 这里纯前端展示，不发送真实请求
};

renderGrid();
renderCart();
</script>
</body>
</html>
