<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>后台管理</title>
<style>:root{--bg:#0f1115;--card:#191c22;--line:#272b33;--fg:#e8eaed;--sub:#9aa3ad;--acc:#d946ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px sans-serif}.wrap{max-width:960px;margin:0 auto;padding:24px}button{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--acc);color:#fff}input,select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;margin-bottom:8px}nav{display:flex;gap:8px;margin:16px 0}nav button{background:var(--card);border:1px solid var(--line);color:var(--fg)}nav button.on{background:var(--acc);color:#fff}.order{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.orow{display:flex;justify-content:space-between}.sub{color:var(--sub);font-size:13px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}td input{width:80px}</style></head><body>
<div class="wrap"><h1>lynli后台管理</h1><div id="login"><input id="pass" type="password" placeholder="管理密码 (默认 admin123)"/><button id="loginBtn">进入</button></div>
<div id="panel" hidden><nav><button data-tab="orders" class="on">订单管理</button><button data-tab="products">商品管理</button></nav><section id="orders"></section><section id="products" hidden></section></div></div>
<script>
const $=s=>document.querySelector(s);const money=n=>'¥'+n;let pass=localStorage.getItem('adminPass')||'';
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json','x-admin-pass':pass}});const d=await r.json();if(!r.ok)throw new Error(d.error);return d;}
async function renderOrders(){const os=await api('/api/admin/orders');$('#orders').innerHTML=os.length?os.map(o=>`<div class="order"><div class="orow"><strong>${o.id}</strong><select data-id="${o.id}" style="width:100px">${['待付款','已付款','已发货','已完成'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="sub">${o.name} ${o.phone} ${o.address}</div><ul>${o.items.map(i=>`<li>${i.name} x ${i.qty} = ${money(i.sum)}</li>`).join('')}</ul><strong class="price">${money(o.total)}</strong></div>`).join(''):'<p class="sub">暂无订单</p>';}
async function renderProducts(){const ps=await api('/api/admin/products');$('#products').innerHTML=`<table><tr><th>图</th><th>名称</th><th>价格</th><th>库存</th><th>操作</th></tr>${ps.map(p=>`<tr><td style="font-size:24px">${p.emoji}</td><td>${p.name}</td><td><input type="number" data-f="price" data-id="${p.id}" value="${p.price}"/></td><td><input type="number" data-f="stock" data-id="${p.id}" value="${p.stock}"/></td><td><button data-del="${p.id}" style="background:#ff5c5c">删除</button></td></tr>`).join('')}</table><h3>添加商品</h3><form id="addForm"><input name="emoji" value="📦" placeholder="图标 emoji"/><input name="name" placeholder="商品名" required/><input name="price" type="number" placeholder="价格" required/><input name="stock" type="number" placeholder="库存" required/><input name="desc" placeholder="描述"/><button>添加</button></form>`;}
document.addEventListener('change',async e=>{const{f,id}=e.target.dataset;if(f)await api('/api/admin/products/'+id,{method:'PATCH',body:JSON.stringify({[f]:e.target.value})});});
document.addEventListener('click',async e=>{if(e.target.dataset.del&&confirm('删除？')){await api('/api/admin/products/'+e.target.dataset.del,{method:'DELETE'});renderProducts();}});
document.addEventListener('submit',async e=>{if(e.target.id==='addForm'){e.preventDefault();const b={};new FormData(e.target).forEach((v,k)=>b[k]=v);await api('/api/admin/products',{method:'POST',body:JSON.stringify(b)});renderProducts();}});
document.addEventListener('change',async e=>{if(e.target.dataset.id&&e.target.tagName==='SELECT'){await api('/api/admin/orders/'+e.target.dataset.id,{method:'PATCH',body:JSON.stringify({status:e.target.value})});}});
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.tab;if(!t)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));$('#orders').hidden=t!=='orders';$('#products').hidden=t!=='products';};
$('#loginBtn').onclick=async()=>{pass=$('#pass').value;try{await api('/api/admin/orders');localStorage.setItem('adminPass',pass);$('#login').hidden=true;$('#panel').hidden=false;renderOrders();renderProducts();}catch{alert('密码错误');}};
if(pass)$('#loginBtn').click();
</script></body></html>
