<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>lynli私密馆</title>
<style>:root{--bg:#0f1115;--card:#191c22;--line:#272b33;--fg:#e8eaed;--sub:#9aa3ad;--acc:#d946ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 sans-serif}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(15,17,21,.85);border-bottom:1px solid var(--line)}h1{margin:0;font-size:18px;letter-spacing:1px}button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:#fff}#cartBtn{background:var(--card);border:1px solid var(--line);color:var(--fg)}#cartCount{background:var(--acc);color:#fff;padding:0 6px;border-radius:10px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:20px;max-width:1100px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.thumb{aspect-ratio:1;display:grid;place-items:center;font-size:64px;background:#23272f}.body{padding:12px;display:flex;flex-direction:column;gap:6px}.name{font-weight:600}.desc{color:var(--sub);font-size:13px;flex:1}.price{color:var(--acc);font-weight:700}#mask{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:20}#mask.on{opacity:1;pointer-events:auto}#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:21;display:flex;flex-direction:column}#drawer.on{transform:none}.dhead{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}.close{background:transparent;color:var(--sub);font-size:20px}#items{flex:1;overflow:auto;padding:12px 16px}.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.qty button{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:2px 10px}form{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}.total{display:flex;justify-content:space-between;font-weight:700}#msg{color:#3ddc84;font-size:14px;word-break:break-all}</style></head><body>
<header><h1>lynli私密馆</h1><button id="cartBtn">购物车<span id="cartCount">0</span></button></header><main id="grid"></main><div id="mask"></div>
<aside id="drawer"><div class="dhead"><strong>购物车</strong><button class="close" id="closeBtn">×</button></div><div id="items"></div>
<form id="orderForm"><div class="total"><span>合计</span><span id="total">¥0</span></div><div style="font-size:12px;color:#9aa3ad;">🔒 隐私发货 · 包裹无敏感词 · 保密包装</div><input name="name" placeholder="收货人姓名" required/><input name="phone" placeholder="手机号" required/><textarea name="address" rows="2" placeholder="收货地址" required></textarea><button type="submit">提交订单</button><div id="msg"></div></form></aside>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'¥'+Number(n).toFixed(2).replace(/\.00$/,'');
let products=[];let cart=JSON.parse(localStorage.getItem('cart')||'{}');
async function loadProducts(){products=await(await fetch('/api/products')).json();renderGrid();}
function renderGrid(){$('#grid').innerHTML=products.map(p=>`<article class="card"><div class="thumb">${p.emoji||'📦'}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.desc)}</div><div class="row" style="display:flex;justify-content:space-between;align-items:center"><span class="price">${money(p.price)}</span>${p.stock>0?`<button data-add="${esc(p.id)}">加入购物车</button>`:`<span style="color:#9aa3ad">已售罄</span>`}</div></div></article>`).join('');}
function renderCart(){const lines=Object.entries(cart).map(([id,qty])=>({p:products.find(x=>x.id===id),qty})).filter(l=>l.p&&l.qty>0);$('#cartCount').textContent=lines.reduce((s,l)=>s+l.qty,0);$('#items').innerHTML=lines.length?lines.map(({p,qty})=>`<div class="line"><div style="font-size:28px">${p.emoji}</div><div style="flex:1"><div>${esc(p.name)}</div><div class="price">${money(p.price*qty)}</div></div><div class="qty"><button data-dec="${p.id}">−</button><span>${qty}</span><button data-inc="${p.id}">＋</button></div></div>`).join(''):'<div style="text-align:center;padding:40px;color:#9aa3ad">购物车还是空的</div>';$('#total').textContent=money(lines.reduce((s,l)=>s+l.p.price*l.qty,0));localStorage.setItem('cart',JSON.stringify(cart));}
$('#cartBtn').onclick=()=>{$('#drawer').classList.add('on');$('#mask').classList.add('on')};$('#closeBtn').onclick=()=>{$('#drawer').classList.remove('on');$('#mask').classList.remove('on')};$('#mask').onclick=()=>$('#closeBtn').click();
document.addEventListener('click',e=>{const{add,inc,dec}=e.target.dataset;if(add){cart[add]=Math.min((cart[add]||0)+1,products.find(p=>p.id===add).stock);renderCart();$('#cartBtn').click();}if(inc){cart[inc]=Math.min((cart[inc]||0)+1,products.find(p=>p.id===inc).stock);renderCart();}if(dec){cart[dec]=(cart[dec]||0)-1;if(cart[dec]<=0)delete cart[dec];renderCart();}});
$('#orderForm').onsubmit=async e=>{e.preventDefault();const f=e.target,btn=f.querySelector('button'),msg=$('#msg');btn.disabled=true;msg.style.color='#9aa3ad';msg.textContent='提交中...';
try{const items=Object.entries(cart).map(([id,qty])=>({id,qty}));const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,name:f.name.value,phone:f.phone.value,address:f.address.value})});const d=await r.json();if(!r.ok)throw new Error(d.error);cart={};renderCart();f.reset();msg.style.color='#3ddc84';msg.textContent=`下单成功！订单号:${d.order.id}，合计:${money(d.order.total)}`;await loadProducts();}catch(err){msg.style.color='#ff5c5c';msg.textContent=err.message;}finally{btn.disabled=false;}};
loadProducts();renderCart();
</script></body></html>
