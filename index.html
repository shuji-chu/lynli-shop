<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYNLI | 全球网络加速</title>
<style>
  :root{--bg:#0f1115;--surface:#191c22;--line:#272b33;--text:#e8eaed;--sub:#9aa3ad;--acc:#3b82f6;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:fixed;top:0;width:100%;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:rgba(15,17,21,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  
  /* 这里是你的 Logo 样式 */
  .logo img{height: 32px; width: auto; object-fit: contain; display: block;}
  
  .btn{cursor:pointer;border:0;border-radius:8px;padding:8px 16px;background:var(--acc);color:#fff;font-size:14px;transition:.2s}
  .btn:hover{filter:brightness(1.1)}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn-outline:hover{border-color:var(--acc);color:var(--acc)}
  
  main{max-width:1000px;margin:100px auto 40px;padding:0 20px}
  .hero{text-align:center;margin-bottom:60px}
  .hero h1{font-size:36px;font-weight:300;margin-bottom:16px;letter-spacing:2px}
  .hero p{color:var(--sub);font-size:16px}
  
  .plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .plan-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;transition:.3s;position:relative;overflow:hidden}
  .plan-card:hover{border-color:var(--acc);transform:translateY(-4px)}
  .plan-name{font-size:18px;font-weight:600;margin-bottom:12px}
  .plan-price{font-size:32px;font-weight:700;color:var(--acc);margin-bottom:16px}
  .plan-price span{font-size:14px;font-weight:400;color:var(--sub)}
  .plan-desc{color:var(--sub);font-size:13px;margin-bottom:20px;min-height:40px}
  .plan-actions{margin-top:20px}
  .plan-actions .btn{width:100%}
  
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:1000}
  #modal.on{display:flex}
  .modal-box{background:var(--surface);width:90%;max-width:400px;padding:30px;border-radius:12px;position:relative}
  .modal-box h2{margin-bottom:20px;font-size:20px;font-weight:500}
  .form-group{margin-bottom:16px}
  .form-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);outline:none}
  .form-group input:focus{border-color:var(--acc)}
  .modal-close{position:absolute;top:16px;right:16px;background:none;border:0;color:var(--sub);font-size:24px;cursor:pointer}
  #msg{color:#ef4444;font-size:13px;margin-bottom:10px;min-height:18px}
</style>
</head>
<body>

<header>
  <!-- 这里使用了你仓库根目录的 logo.png -->
  <div class="logo">
    <img src="./logo.png" alt="LYNLI" />
  </div>
  <div>
    <button class="btn btn-outline" id="loginBtn" onclick="openModal()">登录 / 注册</button>
    <button class="btn" id="userBtn" style="display:none" onclick="logout()">退出</button>
  </div>
</header>

<main>
  <div class="hero">
    <h1>极速 · 安全 · 畅联世界</h1>
    <p>全球节点多协议支持，解锁流媒体，保护您的网络隐私</p>
  </div>

  <div class="plan-grid" id="plans">
    <div style="text-align:center;width:100%;color:var(--sub);padding:40px 0;">正在加载套餐...</div>
  </div>
</main>

<div id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 id="modalTitle">登录账号</h2>
    <div id="msg"></div>
    <div class="form-group">
      <input type="email" id="email" placeholder="邮箱地址" />
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="密码" />
    </div>
    <button class="btn" style="width:100%" onclick="submitAuth()">确认</button>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--sub)">
      <span id="switchText">没有账号？去注册</span>
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://api.lynli.me'; // 你的网关地址

let isLogin = true;
let token = localStorage.getItem('lynli_token') || '';

checkLogin();
fetchPlans();

function openModal() { document.getElementById('modal').classList.add('on'); }
function closeModal() { document.getElementById('modal').classList.remove('on'); document.getElementById('msg').innerText = ''; }
function toggleMode() {
  isLogin = !isLogin;
  document.getElementById('modalTitle').innerText = isLogin ? '登录账号' : '注册账号';
  document.getElementById('switchText').innerText = isLogin ? '没有账号？去注册' : '已有账号？去登录';
}
document.getElementById('switchText').onclick = toggleMode;

async function req(path, method = 'GET', body = null) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const opt = { method, headers };
  if (body) opt.body = JSON.stringify(body);
  
  const res = await fetch(API_BASE + path, opt);
  const data = await res.json();
  // 这里针对你的接口返回格式做了调整
  if (!res.ok || data.code === 0) throw new Error(data.msg || '请求失败');
  return data;
}

async function submitAuth() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  if (!email || !password) return msg.innerText = '请填写完整';

  try {
    const path = isLogin ? '/api/v1/passport/auth/login' : '/api/v1/passport/auth/register';
    const res = await req(path, 'POST', { email, password });
    // 这里依据你的接口返回结构调整，假设 token 在 res.data.auth_data
    token = res.data.auth_data || res.data.token; 
    localStorage.setItem('lynli_token', token);
    closeModal();
    checkLogin();
  } catch (e) {
    msg.innerText = e.message;
  }
}

function checkLogin() {
  if (token) {
    document.getElementById('loginBtn').style.display = 'none';
    document.getElementById('userBtn').style.display = 'inline-block';
  } else {
    document.getElementById('loginBtn').style.display = 'inline-block';
    document.getElementById('userBtn').style.display = 'none';
  }
}

function logout() {
  token = '';
  localStorage.removeItem('lynli_token');
  checkLogin();
}

async function fetchPlans() {
  try {
    const res = await req('/api/v1/user/plan/fetch');
    const plans = res.data;
    const grid = document.getElementById('plans');
    
    if (!plans || plans.length === 0) {
      grid.innerHTML = '<div style="text-align:center;width:100%;color:var(--sub)">暂无可用套餐</div>';
      return;
    }

    grid.innerHTML = plans.map(p => `
      <div class="plan-card">
        <div class="plan-name">${p.name}</div>
        <div class="plan-price">¥${p.price / 100} <span>/ ${p.period === 'month' ? '月' : (p.period === 'year' ? '年' : '永久')}</span></div>
        <div class="plan-desc">${p.content || '高品质节点'}</div>
        <div class="plan-actions">
          <button class="btn" onclick="buyPlan(${p.id})">立即订阅</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('plans').innerHTML = `<div style="text-align:center;width:100%;color:#ef4444">加载失败: ${e.message}</div>`;
  }
}

async function buyPlan(planId) {
  if (!token) { openModal(); return; }
  
  try {
    const saveRes = await req('/api/v1/user/order/save', 'POST', { plan_id: planId, quantity: 1 });
    const orderId = saveRes.data; 
    
    const payRes = await req('/api/v1/user/order/pay', 'POST', { trade_no: orderId });
    const payData = payRes.data;
    
    if (payData.type === 'url' || payData.pay_url) {
      window.location.href = payData.pay_url || payData.url;
    } else if (payData.type === 'qrcode') {
      alert("请使用支付宝或 USDT 扫码支付: " + payData.qrcode_url);
    } else {
      alert(JSON.stringify(payData)); 
    }
  } catch (e) {
    alert('购买失败: ' + e.message);
  }
}
</script>
</body>
</html>
